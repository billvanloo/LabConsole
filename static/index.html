<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lab Console</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div id="app">
  <div class="statusbar">
    <span class="title">LAB CONSOLE</span>
    <span class="glyphs">⌌⍚⌏ ⍙⌇⍜ ⌈⍑⌋</span>
    <span class="spacer"></span>
    <span id="chips"></span>
    <span class="linkstate down" id="link">LINK…</span>
    <span class="clock" id="clock">--:--:--</span>
  </div>
  <div id="fleet"><div class="grid" id="grid"></div></div>
  <div id="detail" class="hidden"></div>
</div>
<script src="/static/app.js"></script>
</body>
</html>
